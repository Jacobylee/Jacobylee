<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>旅行攻略</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif;
    background: #f0f2f5;
    color: #1a1a2e;
    line-height: 1.6;
    min-height: 100vh;
  }
  .header {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    padding: 60px 20px 50px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .header::after {
    content: '';
    position: absolute;
    bottom: -20px; left: 0; right: 0;
    height: 40px;
    background: #f0f2f5;
    border-radius: 50% 50% 0 0;
  }
  .header h1 { font-size: 28px; font-weight: 700; letter-spacing: 2px; margin-bottom: 8px; }
  .header .subtitle { font-size: 14px; opacity: 0.85; letter-spacing: 1px; }
  .container { max-width: 600px; margin: 0 auto; padding: 20px 16px 60px; }

  .trip-card {
    display: block;
    background: white;
    border-radius: 16px;
    margin-bottom: 16px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    overflow: hidden;
    text-decoration: none;
    color: inherit;
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .trip-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 24px rgba(0,0,0,0.1);
  }
  .trip-banner {
    height: 120px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }
  .trip-banner::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 30% 40%, rgba(255,255,255,0.15), transparent 60%);
  }
  .trip-banner .emoji {
    font-size: 48px;
    position: relative;
    z-index: 1;
  }
  .trip-banner .label {
    position: absolute;
    bottom: 10px;
    right: 14px;
    font-size: 11px;
    font-weight: 600;
    color: rgba(255,255,255,0.8);
    letter-spacing: 1px;
    z-index: 1;
  }
  .vietnam-banner {
    background: linear-gradient(135deg, #c0392b 0%, #e74c3c 50%, #f39c12 100%);
  }
  .europe-banner {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  }
  .trip-body {
    padding: 16px 20px 20px;
  }
  .trip-title {
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 6px;
  }
  .trip-meta {
    font-size: 13px;
    color: #888;
    margin-bottom: 10px;
  }
  .trip-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .trip-tag {
    background: #f5f6fa;
    border-radius: 6px;
    padding: 3px 10px;
    font-size: 11px;
    font-weight: 500;
    color: #666;
  }
  .arrow-hint {
    text-align: center;
    color: #ccc;
    font-size: 12px;
    margin-top: 8px;
  }

  @media (max-width: 640px) {
    .header { padding: 44px 16px 38px; }
    .header h1 { font-size: 22px; }
    .container { padding: 16px 12px 40px; }
    .trip-banner { height: 100px; }
    .trip-body { padding: 14px 16px 16px; }
    .trip-title { font-size: 16px; }
  }
</style>
</head>
<body>

<div class="header">
  <h1>旅行攻略</h1>
  <div class="subtitle">我们的足迹</div>
</div>

<div class="container">

  <a class="trip-card" href="vietnam.html">
    <div class="trip-banner vietnam-banner">
      <span class="emoji">🇻🇳</span>
      <span class="label">VIETNAM</span>
    </div>
    <div class="trip-body">
      <div class="trip-title">胡志明市情侣旅游攻略</div>
      <div class="trip-meta">西贡 · 美食 · 文化</div>
      <div class="trip-tags">
        <span class="trip-tag">西贡</span>
        <span class="trip-tag">美食</span>
        <span class="trip-tag">打卡</span>
        <span class="trip-tag">购物</span>
      </div>
    </div>
  </a>

  <a class="trip-card" href="europe.html">
    <div class="trip-banner europe-banner">
      <span class="emoji">🇪🇺</span>
      <span class="label">EUROPE 2026</span>
    </div>
    <div class="trip-body">
      <div class="trip-title">2026 欧洲之旅</div>
      <div class="trip-meta">9.24 — 10.8 · 广州出发</div>
      <div class="trip-tags">
        <span class="trip-tag">🇩🇰 哥本哈根</span>
        <span class="trip-tag">🇸🇪 马尔默</span>
        <span class="trip-tag">🇫🇷 尼斯</span>
        <span class="trip-tag">🇲🇨 摩纳哥</span>
        <span class="trip-tag">🇫🇷 巴黎</span>
        <span class="trip-tag">🇹🇭 曼谷</span>
      </div>
    </div>
  </a>

  <div class="arrow-hint">点击上方卡片查看攻略</div>

</div>

</body>
</html>
